org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true
android.suppressUnsupportedCompileSdk=33
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=5
# 代理设置：本机 WinINET 代理 127.0.0.1:7897，供 Gradle 下载 distro 与 Maven 依赖
# 代理已在非 Windows 环境移除(原 127.0.0.1:7897 无监听)

# ============================================================
# FFmpeg 版本选择（编译时）
# ============================================================
# 不设置此属性时默认使用 v6（稳定版）。
#
# 使用方法（命令行）：
#   ./gradlew assembleRelease -PffmpegVersion=6   # FFmpeg 6.x（默认）
#   ./gradlew assembleRelease -PffmpegVersion=8   # FFmpeg 8.x（最新版）
#
# 或使用便捷脚本：
#   ./build-apk.sh 6 release   # 构建 FFmpeg 6.x release APK
#   ./build-apk.sh 8 release   # 构建 FFmpeg 8.x release APK
#
# AAR 文件命名约定（放在 app/libs/ 下）：
#   ffmpeg-kit-full-v6.aar  → FFmpeg 6.x 编译的 AAR
#   ffmpeg-kit-full-v8.aar  → FFmpeg 8.x 编译的 AAR
#   ffmpeg-kit-full.aar     → 向后兼容（未指定版本时使用，视为 v6）
#
# 运行时检测：
#   Kotlin 代码可通过 FFmpegVersion.isV8() / isV6() 判断当前版本。
#   BuildConfig.FFMPEG_VERSION 包含编译时选择的版本号字符串。
# ============================================================
#ffmpegVersion=6

