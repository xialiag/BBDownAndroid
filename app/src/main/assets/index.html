<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FB7299">
<title>BBDown</title>
<script>
// 在 CSS 渲染前同步应用主题，避免启动时主题闪烁
(function(){
  try {
    var theme = AndroidBridge.getThemeSync();
    if(theme && theme !== 'system'){
      document.documentElement.setAttribute('data-theme', theme);
    }
    try { localStorage.setItem('theme', theme); } catch(e){}
  } catch(e){
    // 桥接不可用时回退到 localStorage（WebView 恢复状态场景）
    try {
      var saved = localStorage.getItem('theme');
      if(saved && saved !== 'system'){
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch(e2){}
  }
})();
</script>
<link rel="stylesheet" href="app.css?v=1.9.89">
</head>
<body>

    </div>

<script src="app.js?v=1.9.89"></script>
</body>
</html>
