<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FB7299">
<title>BBDown</title>
<script>
// 在 CSS 渲染前同步应用主题，避免启动时主题闪烁
(function(){
  try {
    var theme = AndroidBridge.getThemeSync();
    if(theme && theme !== 'system'){
      document.documentElement.setAttribute('data-theme', theme);
    }
    try { localStorage.setItem('theme', theme); } catch(e){}
  } catch(e){
    // 桥接不可用时回退到 localStorage（WebView 恢复状态场景）
    try {
      var saved = localStorage.getItem('theme');
      if(saved && saved !== 'system'){
        document.documentElement.setAttribute('data-theme', saved);
      }
    } catch(e2){}
  }
})();
</script>
<link rel="stylesheet" href="app.css?v=1.9.89">
</head>
<body>
<div id="app">

  <header id="titlebar">
    <div class="titlebar-left">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><rect x="2" y="2" width="20" height="20" rx="5" fill="#FAD4E0"/><path fill="#FFFFFF" d="M11,7 L13,7 L13,12 L14.5,10.5 L16,12 L12,16 L8,12 L9.5,10.5 L11,12 Z"/><rect x="7.5" y="16.8" width="9" height="2" rx="0.5" fill="#FFFFFF"/></svg>
      </div>
      <span class="title-text">BBDown — 视频下载器</span>
    </div>
    <div class="titlebar-right">
    </div>
  </header>

  <div id="content">

    <nav id="activitybar">
      <div class="activity-group">
        <button class="ab-btn active" data-view="explorer" title="任务列表">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 5h16v2H4zm0 4h16v2H4zm0 4h16v2H4zm0 4h16v2H4z"/></svg>
        </button>
        <button class="ab-btn" data-view="addtask" title="新建下载">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M11 3h2v9.6l3.3-3.3 1.4 1.4L12 16l-5.7-5.3 1.4-1.4L11 12.6z"/><rect x="5" y="18" width="14" height="2.4" rx="1.2" fill="currentColor"/></svg>
        </button>
        <button class="ab-btn" data-view="search" title="搜索UP主">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        </button>
        <button class="ab-btn" data-view="account" title="账号">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg>
        </button>
      </div>
      <div class="activity-group">
        <button class="ab-btn" data-view="help" title="说明">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 4a6 6 0 0 0-4 10.5V16a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-1.5A6 6 0 0 0 12 4zm-1 15h2v2h-2z"/></svg>
        </button>
        <button class="ab-btn" data-view="settings" title="设置">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>
    </nav>

    <aside id="sidebar">
      <div class="sidebar-header">
        <span id="sidebarTitle">任务列表</span>
      </div>
      <div id="sidebarBody" class="sidebar-body"></div>
    </aside>

    <main id="editor">
      <div class="tabs" id="tabs"></div>
      <div id="editorBody" class="editor-body"></div>
    </main>

  </div>

  <footer id="statusbar">
    <span id="statusConn" class="sb-item sb-conn"><i class="sb-dot" id="sbDot"></i><span id="sbConnText">未登录</span></span>
    <span id="statusTasks" class="sb-item">0 运行中 · 0 已完成</span>
    <span class="sb-right" id="sbVer">BBDown Android v1.9.89</span>
  </footer>

</div>

<div id="toast" class="toast hidden"></div>

<script>
(function(){
  var _origAdd = AndroidBridge.addTask;
  var _origBatch = AndroidBridge.addBatchTasks;
  function fmtSz(b){if(!b||b<=0)return'';if(b>=1048576)return'~'+(b/1048576).toFixed(2)+' MB';return'~'+(b/1024).toFixed(1)+' KB';}
  function fetchStreams(url,cb){
    var rid=++window._bseq;
    window._bres[rid]={resolve:function(d){cb(d);},reject:function(e){toast('获取流失败:'+e,'err');}};
    try{AndroidBridge.getAvailableStreams(rid,url);}catch(e){toast('获取流失败:'+e,'err');}
  }
  function mkVLabel(v,dur){
    var p=[v.dfn||''];if(v.res)p.push(v.res);p.push(v.codecs||'');if(v.fps)p.push(v.fps+'fps');p.push(v.bandwidth+'kbps');
    var sz=v.size?v.size*(dur||0)/8:0;if(!sz&&v.bandwidth&&dur)sz=v.bandwidth*1000*dur/8;if(sz>0)p.push(fmtSz(sz));
    return p.join(' | ');
  }
  function showPicker(data,task,onConfirm){
    var vids=data.videos||[],auds=data.audios||[];
    if(!vids.length&&!auds.length){toast('无可用流','err');return;}
    var old=document.getElementById('sp-ov');if(old)old.remove();
    var ov=document.createElement('div');ov.id='sp-ov';
    ov.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px 0';
    var cd=document.createElement('div');
    cd.style.cssText='background:var(--bg,#1a1a2e);border:1px solid var(--border,#333);border-radius:12px;padding:20px;max-width:420px;width:90%;max-height:85vh;overflow-y:auto;color:var(--fg,#e0e0e0)';
    var h='<div style="font-size:16px;font-weight:bold;margin-bottom:16px;text-align:center">'+(data.title||'选择流')+'</div>';
    if(vids.length){
      h+='<div style="font-size:12px;color:var(--fg-dim,#888);margin-bottom:6px">视频流 ('+vids.length+')</div>';
      h+='<div id="sp-vw"></div>';
    }
    if(auds.length){
      h+='<div style="font-size:12px;color:var(--fg-dim,#888);margin:12px 0 6px">音频流 ('+auds.length+')</div>';
      h+='<div id="sp-aw"></div>';
    }
    h+='<div style="display:flex;gap:8px;margin-top:16px">';
    h+='<button id="sp-ok" class="btn btn-primary" style="flex:1">开始下载</button>';
    h+='<button id="sp-no" class="btn" style="flex:1">取消</button></div>';
    cd.innerHTML=h;ov.appendChild(cd);document.body.appendChild(ov);
    var vOpts=vids.map(function(v){return[v.id,mkVLabel(v,data.dur)];});
    var aOpts=auds.map(function(a){var p=[a.codecs||'',a.bandwidth+'kbps'];var sz=a.bandwidth&&data.dur?a.bandwidth*1000*data.dur/8:0;if(sz>0)p.push(fmtSz(sz));return[a.id,p.join(' | ')];});
    var vid='sp_vs',aid='sp_as';
    if(vids.length&&typeof window.csHTML==='function'){document.getElementById('sp-vw').innerHTML=window.csHTML(vid,vOpts,vOpts[0][0]);window._csOpts[vid]=vOpts;window._csVal[vid]=vOpts[0][0];}
    if(auds.length&&typeof window.csHTML==='function'){document.getElementById('sp-aw').innerHTML=window.csHTML(aid,aOpts,aOpts[0][0]);window._csOpts[aid]=aOpts;window._csVal[aid]=aOpts[0][0];}
    document.getElementById('sp-ok').onclick=function(){
      if(vids.length)task.videoId=window._csVal[vid]||vids[0].id;
      if(auds.length)task.preferAudio=window._csVal[aid]||auds[0].id;
      ov.remove();onConfirm(task);
    };
    document.getElementById('sp-no').onclick=function(){ov.remove();};
    ov.onclick=function(e){if(e.target===ov)ov.remove();};
  }
  AndroidBridge.addTask=function(reqId,tj){
    try{var t=typeof tj==='string'?JSON.parse(tj):tj;}catch(e){return _origAdd.call(AndroidBridge,reqId,tj);}
    var url=t.url||'';if(!url)return _origAdd.call(AndroidBridge,reqId,tj);
    fetchStreams(url,function(d){
      showPicker(d,t,function(updated){
        _origAdd.call(AndroidBridge,reqId,JSON.stringify(updated));
      });
    });
  };
  if(_origBatch){
    AndroidBridge.addBatchTasks=function(reqId,tj){
      try{var tasks=typeof tj==='string'?JSON.parse(tj):tj;}catch(e){return _origBatch.call(AndroidBridge,reqId,tj);}
      if(!tasks.length)return _origBatch.call(AndroidBridge,reqId,tj);
      fetchStreams(tasks[0].url||'',function(d){
        showPicker(d,tasks[0],function(updated){
          var vid2=updated.videoId||'';var aid2=updated.preferAudio||'';
          var upd=tasks.map(function(tk){tk.videoId=vid2;tk.preferAudio=aid2;return tk;});
          _origBatch.call(AndroidBridge,reqId,JSON.stringify(upd));
        });
      });
    };
  }
})();
</script>
<script src="app.js?v=1.9.89"></script>
</body>
</html>
